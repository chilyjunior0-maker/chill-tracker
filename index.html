Voici la version "Fidèle à l'Originale" :

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-ground: #F4F7F9;
            --bg-surface: #FFFFFF;
            --primary: #6366F1;
            --success: #10B981;
            --danger: #EF4444;
            --ink-main: #1E293B;
            --ink-muted: #64748B;
            --border-color: #E2E8F0;
            --radius: 8px;
        }

        [data-theme="dark"] {
            --bg-ground: #000000;
            --bg-surface: #111111;
            --primary: #818CF8;
            --success: #34D399;
            --danger: #F87171;
            --ink-main: #FFFFFF;
            --ink-muted: #A1A1AA;
            --border-color: #27272a;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-ground);
            color: var(--ink-main);
            transition: background-color 0.3s ease;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 22px;
            color: var(--primary);
            margin: 0;
        }

        .theme-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--ink-main);
            padding: 5px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 13px;
        }

        /* CALENDRIER SIMPLE (Version Compacte) */
        .calendar-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .cal-title {
            font-weight: 600;
            margin-bottom: 10px;
            display: block;
            font-size: 14px;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            max-width: 280px;
            margin: 0 auto;
        }

        .cal-day {
            font-size: 11px;
            padding: 5px 0;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .cal-today {
            background: var(--primary);
            color: white;
            font-weight: bold;
        }

        /* STATS */
        .stats-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-item {
            flex: 1;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: var(--radius);
            text-align: center;
        }

        .stat-item span {
            font-size: 11px;
            color: var(--ink-muted);
            display: block;
        }

        .stat-item strong {
            font-size: 18px;
            color: var(--primary);
        }

        /* MATIERES ET CASES A COCHER */
        .subject-block {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            margin-bottom: 15px;
            padding: 15px;
        }

        .subject-name {
            font-weight: 600;
            margin-bottom: 10px;
            display: block;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }

        .check-item input {
            cursor: pointer;
            accent-color: var(--primary);
        }

        .add-area {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .input-name {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--bg-surface);
            color: var(--ink-main);
        }

        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: var(--radius);
            cursor: pointer;
        }

        .btn-del {
            color: var(--danger);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 11px;
            float: right;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
        }

        .btn-reset {
            color: var(--danger);
            background: none;
            border: 1px solid var(--danger);
            padding: 5px 10px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Chill Tracker</h1>
            <button class="theme-btn" id="themeToggle">🌓 Thème</button>
        </header>

        <div class="calendar-box">
            <span class="cal-title" id="calMonth">Mois</span>
            <div class="cal-grid" id="calGrid"></div>
        </div>

        <div class="stats-container">
            <div class="stat-item">
                <span>Progression</span>
                <strong id="statPercent">0%</strong>
            </div>
            <div class="stat-item">
                <span>Terminé</span>
                <strong id="statCount">0/0</strong>
            </div>
        </div>

        <div class="add-area">
            <input type="text" id="subjInput" class="input-name" placeholder="Nouvelle matière...">
            <button class="btn-add" id="addBtn">Ajouter</button>
        </div>

        <div id="subjectsList"></div>

        <div class="footer">
            <button class="btn-reset" id="resetBtn">Réinitialiser tout</button>
        </div>
    </div>

    <script>
        let subjects = JSON.parse(localStorage.getItem('chillTrackerData')) || [];
        const DAYS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];

        // Thème
        let theme = localStorage.getItem('chillTheme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);

        document.getElementById('themeToggle').addEventListener('click', () => {
            theme = theme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('chillTheme', theme);
        });

        // Calendrier Compact
        function initCal() {
            const now = new Date();
            const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
            document.getElementById('calMonth').innerText = `${monthNames[now.getMonth()]} ${now.getFullYear()}`;

            const grid = document.getElementById('calGrid');
            const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();

            for(let i=0; i<firstDay; i++) grid.innerHTML += '<div></div>';
            for(let d=1; d<=daysInMonth; d++) {
                const isToday = d === now.getDate() ? 'cal-today' : '';
                grid.innerHTML += `<div class="cal-day ${isToday}">${d}</div>`;
            }
        }

        function save() {
            localStorage.setItem('chillTrackerData', JSON.stringify(subjects));
            updateStats();
        }

        function updateStats() {
            let total = 0, done = 0;
            subjects.forEach(s => s.days.forEach(d => { total++; if(d.completed) done++; }));
            document.getElementById('statPercent').innerText = `${Math.round((done/total)*100) || 0}%`;
            document.getElementById('statCount').innerText = `${done}/${total}`;
        }

        function render() {
            const list = document.getElementById('subjectsList');
            list.innerHTML = '';
            subjects.forEach((s, sIdx) => {
                const div = document.createElement('div');
                div.className = 'subject-block';
                div.innerHTML = `
                    <span class="subject-name">${s.name} <button class="btn-del" onclick="deleteSub(${sIdx})">Supprimer</button></span>
                    <div class="checkbox-group">
                        ${s.days.map((d, dIdx) => `
                            <label class="check-item">
                                <input type="checkbox" ${d.completed ? 'checked' : ''} onchange="toggle(${sIdx}, ${dIdx})">
                                ${d.name}
                            </label>
                        `).join('')}
                    </div>
                `;
                list.appendChild(div);
            });
            updateStats();
        }

        window.toggle = (sIdx, dIdx) => {
            subjects[sIdx].days[dIdx].completed = !subjects[sIdx].days[dIdx].completed;
            save();
            render();
        };

        window.deleteSub = (idx) => {
            if(confirm('Supprimer ?')) {
                subjects.splice(idx, 1);
                save();
                render();
            }
        };

        document.getElementById('addBtn').addEventListener('click', () => {
            const input = document.getElementById('subjInput');
            if(input.value) {
                subjects.push({ name: input.value, days: DAYS.map(d => ({name: d, completed: false})) });
                input.value = '';
                save();
                render();
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            if(confirm('Tout effacer ?')) {
                subjects = [];
                save();
                render();
            }
        });

        initCal();
        render();
    </script>
</body>
</html>
