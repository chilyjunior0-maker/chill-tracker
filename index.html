<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Programme d'apprentissage</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#16211C">
<style>
  :root {
    --bg: #16211C; --card: #1F2E27; --cream: #F3EFE4; --muted: #9DAEA3;
    --gold: #C9A24B; --gold-soft: rgba(201,162,75,0.16); --green-accent: #4E8B6F;
    --border: rgba(243,239,228,0.08); --radius: 14px; --danger: #D97757;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--cream); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 20px 16px 60px; min-height: 100vh; }
  .wrap { max-width: 480px; margin: 0 auto; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 4px; }
  h1 { font-size: 22px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; line-height: 1.5; margin-bottom: 18px; }
  .gear-btn { background: var(--card); border: 1px solid var(--border); color: var(--cream); border-radius: 10px; padding: 8px 12px; font-size: 18px; cursor: pointer; }

  .streak-banner { display:flex; align-items:center; gap:10px; background:var(--gold-soft); border:1px solid rgba(201,162,75,.3); border-radius:var(--radius); padding:12px 16px; margin-bottom:18px; font-size:13px; }
  .streak-banner b { color: var(--gold); font-size: 15px; }

  .day-tabs { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:18px; }
  .day-tab { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 2px; text-align:center; cursor:pointer; }
  .day-tab .dname { font-size:9px; text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
  .day-tab .dnum { font-size:14px; font-weight:700; }
  .day-tab.active { background:var(--gold-soft); border-color:var(--gold); }
  .day-tab.active .dname { color:var(--gold); }
  .day-tab .progress-dot { font-size:9px; color:var(--green-accent); margin-top:2px; }

  .task-list { display:flex; flex-direction:column; gap:8px; margin-bottom:22px; }
  .task-card { display:flex; align-items:flex-start; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; cursor:pointer; }
  .task-card.done { border-color: rgba(78,139,111,.4); background: rgba(78,139,111,.08); }
  .checkbox { flex-shrink:0; width:20px; height:20px; border-radius:6px; border:2px solid var(--muted); margin-top:2px; display:flex; align-items:center; justify-content:center; font-size:12px; }
  .task-name { font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px; margin-bottom:2px; }
  .task-card.done .task-name { text-decoration:line-through; color:var(--muted); }
  .tag { font-size:9px; text-transform:uppercase; color:#16211C; padding:2px 6px; border-radius:20px; font-weight:700; }
  .task-desc { font-size:12px; color:var(--muted); line-height:1.4; }
  .task-goal { font-size:11px; color:var(--gold); margin-top:3px; }
  .empty-day { text-align:center; color:var(--muted); font-size:13px; padding:20px 0; }
  .task-card.locked { cursor:default; opacity:.55; }
  .lock-note { text-align:center; color:var(--muted); font-size:11px; margin:-8px 0 14px; }

  .summary { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:16px; }
  .summary h2 { font-size:12px; text-transform:uppercase; color:var(--muted); margin-bottom:12px; letter-spacing:.06em; }
  .bar-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .bar-label { width:70px; font-size:11px; color:var(--muted); flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track { flex:1; height:7px; background:rgba(255,255,255,.06); border-radius:6px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:6px; }
  .bar-pct { width:32px; text-align:right; font-size:11px; }

  .footer-note { text-align:center; font-size:11px; color:var(--muted); line-height:1.5; padding-top:8px; }

  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; }
  .overlay.open { display:block; }
  .modal { position:fixed; inset:0; background:var(--bg); z-index:101; overflow-y:auto; display:none; }
  .modal.open { display:block; }
  .modal-inner { max-width:480px; margin:0 auto; padding:20px 16px 80px; }
  .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .modal-header h2 { font-size:18px; }
  .close-btn { background:var(--card); border:1px solid var(--border); color:var(--cream); border-radius:8px; padding:6px 12px; font-size:16px; cursor:pointer; }

  .section-title { font-size:12px; text-transform:uppercase; color:var(--muted); letter-spacing:.06em; margin:22px 0 10px; }

  .subject-row, .task-edit-row { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .subject-row { display:flex; align-items:center; gap:10px; }
  .color-dot { width:16px; height:16px; border-radius:50%; flex-shrink:0; border:none; cursor:pointer; }
  .subject-row input[type=text] { flex:1; background:transparent; border:none; color:var(--cream); font-size:14px; outline:none; }
  .del-btn { background:none; border:none; color:var(--danger); font-size:16px; cursor:pointer; padding:4px 8px; }

  .day-select { display:flex; gap:4px; overflow-x:auto; margin-bottom:14px; padding-bottom:4px; }
  .day-select button { flex-shrink:0; background:var(--card); border:1px solid var(--border); color:var(--cream); padding:8px 12px; border-radius:8px; font-size:12px; cursor:pointer; }
  .day-select button.active { background:var(--gold-soft); border-color:var(--gold); color:var(--gold); }

  .task-edit-row { display:flex; flex-direction:column; gap:8px; }
  .task-edit-top { display:flex; align-items:center; gap:8px; }
  .task-edit-row select, .task-edit-row input[type=text] { background:#16211C; border:1px solid var(--border); color:var(--cream); padding:8px; border-radius:6px; font-size:13px; }
  .task-edit-row select { flex-shrink:0; }
  .task-edit-row input[type=text] { flex:1; width:100%; }
  .task-edit-meta { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); }
  .task-edit-meta label { display:flex; align-items:center; gap:5px; }
  .reorder-btns { display:flex; gap:4px; }
  .reorder-btns button { background:#16211C; border:1px solid var(--border); color:var(--cream); border-radius:6px; width:26px; height:26px; cursor:pointer; }

  .add-btn { width:100%; background:var(--gold-soft); border:1px solid var(--gold); color:var(--gold); border-radius:10px; padding:10px; font-size:13px; font-weight:700; cursor:pointer; margin-top:6px; }

  .theme-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-bottom:10px; }
  .theme-swatch { width:100%; aspect-ratio:1; border-radius:8px; cursor:pointer; border:2px solid transparent; }
  .theme-swatch.selected { border-color: var(--cream); }

  .reset-btn { width:100%; background:none; border:1px solid var(--danger); color:var(--danger); border-radius:10px; padding:10px; font-size:13px; cursor:pointer; margin-top:30px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row">
    <div>
      <div class="eyebrow">Programme d'apprentissage</div>
      <h1 id="pageTitle">Cette semaine</h1>
    </div>
    <button class="gear-btn" id="openSettings">⚙</button>
  </div>
  <div class="sub" id="pageSub"></div>

  <div class="streak-banner" id="streakBanner"></div>
  <div class="day-tabs" id="dayTabs"></div>
  <div id="lockNote"></div>
  <div class="task-list" id="taskList"></div>
  <div class="summary">
    <h2>Résumé de la semaine</h2>
    <div id="summaryBars"></div>
  </div>
  <div class="summary">
    <h2 id="monthlyTitle">Bilan du mois</h2>
    <div id="monthlyBars"></div>
  </div>
  <div class="footer-note">Données sauvegardées uniquement sur cet appareil, dans ce navigateur.</div>
</div>

<div class="overlay" id="overlay"></div>
<div class="modal" id="settingsModal">
  <div class="modal-inner">
    <div class="modal-header">
      <h2>Personnaliser</h2>
      <button class="close-btn" id="closeSettings">✕</button>
    </div>

    <div class="section-title">Thème de couleur</div>
    <div class="theme-grid" id="themeGrid"></div>

    <div class="section-title">Matières</div>
    <div id="subjectsList"></div>
    <button class="add-btn" id="addSubject">+ Ajouter une matière</button>

    <div class="section-title">Tâches par jour</div>
    <div class="day-select" id="daySelectEdit"></div>
    <div id="tasksEditList"></div>
    <button class="add-btn" id="addTask">+ Ajouter une tâche ce jour-là</button>

    <button class="reset-btn" id="resetBtn">Réinitialiser tout (matières, tâches, progression)</button>
  </div>
</div>

<script>
const JOURS = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const JOURS_COURT = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const CONFIG_KEY = "learning-tracker-config-v2";
const DATA_KEY = "learning-tracker-progress-v2";

const THEMES = ["#C9A24B","#4E8B6F","#5B8DC7","#B36B8E","#C77B4E","#8E7BC7"];

const DEFAULT_CONFIG = {
  themeColor: "#C9A24B",
  subjects: [
    {id:"coran", name:"Coran", color:"#C9A24B"},
    {id:"excel", name:"Excel", color:"#4E8B6F"},
    {id:"python", name:"Python", color:"#5B8DC7"},
    {id:"arabe", name:"Arabe", color:"#B36B8E"},
    {id:"anglais", name:"Anglais", color:"#C77B4E"},
  ],
  program: {
    "Lundi":    [{subjectId:"coran", desc:"Révision + nouveau si possible", priority:true, goal:""},
                 {subjectId:"excel", desc:"1 exercice pratique", priority:false, goal:""},
                 {subjectId:"python", desc:"Atelier en cours", priority:false, goal:""}],
    "Mardi":    [{subjectId:"coran", desc:"Révision + nouveau si possible", priority:true, goal:""},
                 {subjectId:"excel", desc:"1 exercice pratique", priority:false, goal:""},
                 {subjectId:"arabe", desc:"Grammaire ou vocabulaire", priority:false, goal:""}],
    "Mercredi": [{subjectId:"coran", desc:"Révision + nouveau si possible", priority:true, goal:""},
                 {subjectId:"excel", desc:"1 exercice pratique", priority:false, goal:""},
                 {subjectId:"anglais", desc:"Vocabulaire / lecture", priority:false, goal:""}],
    "Jeudi":    [{subjectId:"coran", desc:"Révision + nouveau si possible", priority:true, goal:""},
                 {subjectId:"excel", desc:"1 exercice pratique", priority:false, goal:""},
                 {subjectId:"python", desc:"Atelier en cours", priority:false, goal:""}],
    "Vendredi": [{subjectId:"coran", desc:"Révision + nouveau si possible", priority:true, goal:""},
                 {subjectId:"excel", desc:"1 exercice pratique", priority:false, goal:""},
                 {subjectId:"arabe", desc:"Révision rapide", priority:false, goal:""}],
    "Samedi":   [{subjectId:"coran", desc:"Révision + nouveau si possible", priority:true, goal:""},
                 {subjectId:"anglais", desc:"Pratique orale / écoute", priority:false, goal:""}],
    "Dimanche": [{subjectId:"coran", desc:"Révision, même courte", priority:true, goal:""}],
  }
};

function loadConfig() {
  try {
    const raw = localStorage.getItem(CONFIG_KEY);
    return raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  } catch(e) { return JSON.parse(JSON.stringify(DEFAULT_CONFIG)); }
}
function saveConfig() { localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); }

function loadData() {
  try { const raw = localStorage.getItem(DATA_KEY); return raw ? JSON.parse(raw) : {}; }
  catch(e) { return {}; }
}
function saveData() { localStorage.setItem(DATA_KEY, JSON.stringify(data)); }

function isoDate(d){ return d.toISOString().split("T")[0]; }
function startOfWeek(d){ const day=d.getDay(); const diff=day===0?-6:1-day; const m=new Date(d); m.setDate(d.getDate()+diff); m.setHours(0,0,0,0); return m; }
function uid(){ return Math.random().toString(36).slice(2,9); }
function subjectById(id){ return config.subjects.find(s=>s.id===id) || {name:"?",color:"#999"}; }
function applyTheme(){ document.documentElement.style.setProperty('--gold', config.themeColor); }

let config = loadConfig();
let data = loadData();
let selectedDate = new Date();
let editingDay = "Lundi";
const monday = startOfWeek(new Date());
const weekDates = Array.from({length:7},(_,i)=>{ const d=new Date(monday); d.setDate(monday.getDate()+i); return d; });

function coranStreak(){
  const coranSubj = config.subjects.find(s => s.name.toLowerCase().includes("coran"));
  if (!coranSubj) return 0;
  let streak=0; let cursor=new Date(); cursor.setHours(0,0,0,0);
  while(true){
    const key=isoDate(cursor);
    if (data[key] && data[key][coranSubj.id]) { streak++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }
  return streak;
}

function weekStats(){
  const totals={}, done={};
  weekDates.forEach(d=>{
    const wd=JOURS[d.getDay()];
    const tasks=config.program[wd]||[];
    const entry=data[isoDate(d)]||{};
    tasks.forEach(t=>{
      totals[t.subjectId]=(totals[t.subjectId]||0)+1;
      if(entry[t.subjectId]) done[t.subjectId]=(done[t.subjectId]||0)+1;
    });
  });
  return Object.keys(totals).map(sid=>({ subj: subjectById(sid), pct: Math.round(100*(done[sid]||0)/totals[sid]) }));
}

function isPastDay(dateKey){
  return dateKey < isoDate(new Date());
}

function toggleTask(dateKey, subjectId){
  if (isPastDay(dateKey)) return; // jour passé, verrouillé
  const existing = data[dateKey] || {};
  existing[subjectId] = !existing[subjectId];
  data[dateKey] = existing;
  saveData();
  render();
}

function monthlyStats(){
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const totals={}, done={};
  for (let day=1; day<=daysInMonth; day++){
    const d = new Date(year, month, day);
    if (d > now) break; // ne compte que jusqu'à aujourd'hui
    const wd = JOURS[d.getDay()];
    const tasks = config.program[wd] || [];
    const entry = data[isoDate(d)] || {};
    tasks.forEach(t=>{
      totals[t.subjectId]=(totals[t.subjectId]||0)+1;
      if(entry[t.subjectId]) done[t.subjectId]=(done[t.subjectId]||0)+1;
    });
  }
  return Object.keys(totals).map(sid=>({ subj: subjectById(sid), pct: Math.round(100*(done[sid]||0)/totals[sid]), done: done[sid]||0, total: totals[sid] }));
}

function render(){
  applyTheme();
  const coranSubj = config.subjects.find(s => s.name.toLowerCase().includes("coran"));
  const streak = coranStreak();
  document.getElementById("pageSub").textContent =
    config.subjects.map(s=>s.name).join(" · ");
  const banner = document.getElementById("streakBanner");
  if (coranSubj) {
    banner.style.display = "flex";
    banner.innerHTML = `🕊 <div>${streak>0 ? `<b>${streak} jour${streak>1?'s':''}</b> de suite sur ${coranSubj.name}` : `0 jour de suite sur ${coranSubj.name} — recommence aujourd'hui.`}</div>`;
  } else {
    banner.style.display = "none";
  }

  const todayKey = isoDate(new Date());
  const selKey = isoDate(selectedDate);

  document.getElementById("dayTabs").innerHTML = weekDates.map(d=>{
    const key=isoDate(d); const wd=JOURS[d.getDay()];
    const tasks=config.program[wd]||[];
    const entry=data[key]||{};
    const doneCount=tasks.filter(t=>entry[t.subjectId]).length;
    const active = key===selKey ? "active":"";
    return `<div class="day-tab ${active}" data-date="${key}">
      <div class="dname">${JOURS_COURT[d.getDay()]}</div>
      <div class="dnum">${d.getDate()}</div>
      ${tasks.length ? `<div class="progress-dot">${doneCount}/${tasks.length}</div>` : ""}
    </div>`;
  }).join("");
  document.querySelectorAll(".day-tab").forEach(el=>{
    el.addEventListener("click", ()=>{ selectedDate = new Date(el.dataset.date+"T00:00:00"); render(); });
  });

  const selWeekday = JOURS[selectedDate.getDay()];
  const selTasks = config.program[selWeekday] || [];
  const selEntry = data[selKey] || {};
  const locked = isPastDay(selKey);

  document.getElementById("lockNote").innerHTML = locked
    ? `<div class="lock-note">🔒 Ce jour est passé — les cases ne sont plus modifiables.</div>` : "";

  document.getElementById("taskList").innerHTML = selTasks.length ? selTasks.map(t=>{
    const subj = subjectById(t.subjectId);
    const done = !!selEntry[t.subjectId];
    return `<div class="task-card ${done?'done':''} ${locked?'locked':''}" data-subject="${t.subjectId}" style="${done?`border-color:${subj.color}66;background:${subj.color}14;`:''} ${t.priority ? `border-left:3px solid ${subj.color};`:''}">
      <div class="checkbox" style="${done?`background:${subj.color};border-color:${subj.color};color:#16211C;`:''}">${done?'✓':(locked?'🔒':'')}</div>
      <div>
        <div class="task-name">${subj.name} ${t.priority ? `<span class="tag" style="background:${subj.color}33;color:${subj.color}">Priorité</span>`:''}</div>
        <div class="task-desc">${t.desc||''}</div>
        ${t.goal ? `<div class="task-goal">🎯 ${t.goal}</div>` : ''}
      </div>
    </div>`;
  }).join("") : `<div class="empty-day">Aucune tâche ce jour — ajoute-en depuis les réglages ⚙</div>`;
  document.querySelectorAll(".task-card").forEach(el=>{
    el.addEventListener("click", ()=>toggleTask(selKey, el.dataset.subject));
  });

  const stats = weekStats();
  document.getElementById("summaryBars").innerHTML = stats.map(s=>`
    <div class="bar-row">
      <div class="bar-label">${s.subj.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${s.pct}%;background:${s.subj.color}"></div></div>
      <div class="bar-pct">${s.pct}%</div>
    </div>`).join("");

  const monthNames = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  document.getElementById("monthlyTitle").textContent = `Bilan de ${monthNames[new Date().getMonth()]}`;
  const mstats = monthlyStats();
  document.getElementById("monthlyBars").innerHTML = mstats.length ? mstats.map(s=>`
    <div class="bar-row">
      <div class="bar-label">${s.subj.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${s.pct}%;background:${s.subj.color}"></div></div>
      <div class="bar-pct">${s.pct}%</div>
    </div>`).join("") : `<div class="empty-day">Rien à afficher pour l'instant.</div>`;
}

function openModal(){
  document.getElementById("overlay").classList.add("open");
  document.getElementById("settingsModal").classList.add("open");
  renderSettings();
}
function closeModal(){
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("settingsModal").classList.remove("open");
  render();
}

function renderSettings(){
  document.getElementById("themeGrid").innerHTML = THEMES.map(c=>`
    <div class="theme-swatch ${config.themeColor===c?'selected':''}" style="background:${c}" data-color="${c}"></div>
  `).join("");
  document.querySelectorAll(".theme-swatch").forEach(el=>{
    el.addEventListener("click", ()=>{ config.themeColor=el.dataset.color; saveConfig(); renderSettings(); });
  });

  document.getElementById("subjectsList").innerHTML = config.subjects.map(s=>`
    <div class="subject-row" data-id="${s.id}">
      <button class="color-dot" style="background:${s.color}" data-action="color"></button>
      <input type="text" value="${s.name}" data-action="name">
      <button class="del-btn" data-action="delete">✕</button>
    </div>
  `).join("");
  document.querySelectorAll(".subject-row").forEach(row=>{
    const id = row.dataset.id;
    row.querySelector('[data-action="name"]').addEventListener("input", e=>{
      subjectById(id).name = e.target.value; saveConfig();
    });
    row.querySelector('[data-action="color"]').addEventListener("click", e=>{
      const s = subjectById(id);
      const idx = THEMES.indexOf(s.color);
      s.color = THEMES[(idx+1)%THEMES.length];
      saveConfig(); renderSettings(); render();
    });
    row.querySelector('[data-action="delete"]').addEventListener("click", ()=>{
      if (!confirm("Supprimer cette matière ? Les tâches liées seront aussi retirées du programme.")) return;
      config.subjects = config.subjects.filter(s=>s.id!==id);
      Object.keys(config.program).forEach(day=>{
        config.program[day] = config.program[day].filter(t=>t.subjectId!==id);
      });
      saveConfig(); renderSettings(); render();
    });
  });

  document.getElementById("daySelectEdit").innerHTML = JOURS.filter(j=>j!=="Dimanche").concat(["Dimanche"]).map(j=>`
    <button class="${j===editingDay?'active':''}" data-day="${j}">${j.slice(0,3)}</button>
  `).join("");
  document.querySelectorAll("#daySelectEdit button").forEach(btn=>{
    btn.addEventListener("click", ()=>{ editingDay = btn.dataset.day; renderSettings(); });
  });

  const tasks = config.program[editingDay] || [];
  document.getElementById("tasksEditList").innerHTML = tasks.map((t,idx)=>`
    <div class="task-edit-row" data-idx="${idx}">
      <div class="task-edit-top">
        <select data-action="subject">
          ${config.subjects.map(s=>`<option value="${s.id}" ${s.id===t.subjectId?'selected':''}>${s.name}</option>`).join("")}
        </select>
        <div class="reorder-btns">
          <button data-action="up">↑</button>
          <button data-action="down">↓</button>
        </div>
        <button class="del-btn" data-action="delete">✕</button>
      </div>
      <input type="text" placeholder="Description" value="${t.desc||''}" data-action="desc">
      <input type="text" placeholder="Objectif (ex: 20 min, 5 pages)" value="${t.goal||''}" data-action="goal">
      <div class="task-edit-meta">
        <label><input type="checkbox" data-action="priority" ${t.priority?'checked':''}> Prioritaire</label>
      </div>
    </div>
  `).join("");

  document.querySelectorAll(".task-edit-row").forEach(row=>{
    const idx = parseInt(row.dataset.idx);
    row.querySelector('[data-action="subject"]').addEventListener("change", e=>{
      config.program[editingDay][idx].subjectId = e.target.value; saveConfig();
    });
    row.querySelector('[data-action="desc"]').addEventListener("input", e=>{
      config.program[editingDay][idx].desc = e.target.value; saveConfig();
    });
    row.querySelector('[data-action="goal"]').addEventListener("input", e=>{
      config.program[editingDay][idx].goal = e.target.value; saveConfig();
    });
    row.querySelector('[data-action="priority"]').addEventListener("change", e=>{
      config.program[editingDay][idx].priority = e.target.checked; saveConfig();
    });
    row.querySelector('[data-action="delete"]').addEventListener("click", ()=>{
      config.program[editingDay].splice(idx,1); saveConfig(); renderSettings();
    });
    row.querySelector('[data-action="up"]').addEventListener("click", ()=>{
      if (idx===0) return;
      const arr=config.program[editingDay];
      [arr[idx-1],arr[idx]]=[arr[idx],arr[idx-1]];
      saveConfig(); renderSettings();
    });
    row.querySelector('[data-action="down"]').addEventListener("click", ()=>{
      const arr=config.program[editingDay];
      if (idx===arr.length-1) return;
      [arr[idx+1],arr[idx]]=[arr[idx],arr[idx+1]];
      saveConfig(); renderSettings();
    });
  });
}

document.getElementById("openSettings").addEventListener("click", openModal);
document.getElementById("closeSettings").addEventListener("click", closeModal);
document.getElementById("overlay").addEventListener("click", closeModal);

document.getElementById("addSubject").addEventListener("click", ()=>{
  const name = prompt("Nom de la nouvelle matière :");
  if (!name) return;
  config.subjects.push({ id: uid(), name, color: THEMES[config.subjects.length % THEMES.length] });
  saveConfig(); renderSettings();
});

document.getElementById("addTask").addEventListener("click", ()=>{
  if (!config.subjects.length) { alert("Ajoute d'abord une matière."); return; }
  if (!config.program[editingDay]) config.program[editingDay] = [];
  config.program[editingDay].push({ subjectId: config.subjects[0].id, desc:"", priority:false, goal:"" });
  saveConfig(); renderSettings();
});

document.getElementById("resetBtn").addEventListener("click", ()=>{
  if (!confirm("Tout réinitialiser (matières, tâches ET progression cochée) ? Cette action est irréversible.")) return;
  config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  data = {};
  saveConfig(); saveData();
  renderSettings(); render();
});

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
